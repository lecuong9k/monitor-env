# MediaMTX local — chạy trên MiniPC (PM2: npm run mediamtx:prod)
# Camera RTSP pull on-demand; MiniPC UI WHEP :8889; relay lên central qua FFmpeg

logLevel: info
logDestinations: [stdout]

api: yes
apiAddress: :9997
apiAllowOrigins:
  - "http://127.0.0.1:3000"
  - "http://localhost:3000"
  - "http://192.168.5.97:3000"

metrics: yes
metricsAddress: :9998

webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins:
  - "http://127.0.0.1:3000"
  - "http://localhost:3000"
  - "http://192.168.5.97:3000"
# Thêm IP LAN MiniPC khi deploy production (vd. 192.168.x.x)
webrtcAdditionalHosts:
  - "127.0.0.1"
  - "localhost"
  - "192.168.5.97"
webrtcLocalUDPAddress: :8189
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302

rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]

rtmp: no
hls: no
srt: no
moq: no

authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: read
        path:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
        path:
  - user: any
    pass:
    ips: []
    permissions:
      - action: api
  - user: any
    pass:
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: metrics

pathDefaults:
  rtspTransport: tcp
  sourceOnDemand: true
  sourceOnDemandStartTimeout: 10s
  sourceOnDemandCloseAfter: 10s

paths: {}
