# MediaMTX — production (PM2)
# Chạy: pm2 start ecosystem.config.cjs
# Firewall: mở 3000/tcp, 8889/tcp, 8189/udp. KHÔNG mở 9997.

logLevel: info
logDestinations: [stdout]

# --- Control API: chỉ backend localhost ---
api: yes
apiAddress: 127.0.0.1:9997
apiAllowOrigins: ["http://192.168.5.97:3000", "http://45.76.152.73:20001"]

# --- Metrics (localhost) ---
metrics: yes
metricsAddress: 127.0.0.1:9998

# --- WebRTC / WHEP ---
webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins:
  - "http://192.168.5.97:3000"
  - "http://45.76.152.73:20001"
webrtcAdditionalHosts:
  - "192.168.5.97"
  - "45.76.152.73"
webrtcLocalUDPAddress: :8189
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302

# --- RTSP nội bộ ---
rtsp: yes
rtspAddress: 127.0.0.1:8554
rtspTransports: [tcp]

rtmp: no
hls: no
srt: no
moq: no

# --- Authentication ---
authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: read
        path:
  - user: any
    pass:
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: api
      - action: metrics

pathDefaults:
  rtspTransport: tcp

paths:
  camera1:
    # Source RTSP được backend gán động qua Control API lúc start stream
    source: publisher
